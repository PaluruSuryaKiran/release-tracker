name: release-tracker-surya
license: Apache-2.0
base: core24
version: '0.1.0'
summary: Track package releases through a small REST API
description: |
  A FastAPI service that registers packages and their releases,
  and reports each package's latest version by semantic version order.
  Needs a PostgreSQL database. The database URL and the API key are read
  from root-only files in /var/snap/release-tracker-surya/common/.
  See the README for setup.
  
grade: devel
confinement: strict

apps:
  server:
    command: bin/launch
    daemon: simple
    stop-timeout: 30s
    install-mode: disable
    restart-condition: on-failure
    environment:
      DATABASE_URL: $SNAP_COMMON/database-url
      API_KEY: $SNAP_COMMON/api-key
    plugs:
      - network
      - network-bind

parts:
  service:
    plugin: python
    source: .
  launcher:
    plugin: dump
    source: snap/local
    organize:
      launch: bin/launch